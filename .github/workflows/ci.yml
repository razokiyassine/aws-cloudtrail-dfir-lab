name: Python checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Bash syntax
        run: bash -n scripts/*.sh
      - name: Check supplied synthetic fixture
        run: python scripts/verify_fixture.py
      - name: Run six unit tests
        run: python -m unittest discover -s tests -v
